<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="csrf-token" content="{{ csrf_token() }}"><meta name="viewport" content="width=device-width, initial-scale=1"><title>{{ page_name }}</title><link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}"></head>
<body>
    <main data-admin-page data-page="{{ page_name }}" data-endpoint="{{ endpoint }}">
        <h1>{{ page_name }}</h1>
        {% if page_name == 'activity' %}
        <form class="activity-controls" data-activity-controls>
            <label>
                活动视图
                <select data-activity-view>
                    <option value="center">活动中心</option>
                    <option value="detail">活动详情</option>
                    <option value="stage">活动阶段</option>
                    <option value="rank">活动排行</option>
                    <option value="boss">活动首领</option>
                </select>
            </label>
            <label>
                玩家 ID
                <input data-activity-user-id type="text" maxlength="128" autocomplete="off">
            </label>
            <button type="submit" data-action="refresh">查询</button>
            <button type="button" data-action="activity-sign" disabled>为玩家签到</button>
        </form>
        {% else %}
        <button type="button" data-action="refresh">刷新</button>
        {% endif %}
        <p data-state-error role="alert"></p>
        <pre data-state-output aria-live="polite"></pre>
    </main>
    <script type="module" src="{{ url_for('static', filename='pages/admin.js') }}"></script>
</body>
</html>
