name: Build and Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
  pull_request:
  workflow_dispatch:
    inputs:
      tag_name:
        description: Optional release tag (used as release version)
        required: false
        type: string

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Install locked dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.lock

      - name: Compile sources
        run: python -m compileall -q nonebot_plugin_xiuxian_2 tests scripts

      - name: Run isolated test suite
        run: python -m unittest discover -s tests -q

      - name: Run repository test collection
        run: python -m unittest discover -s . -p 'test_*.py' -q

      - name: Run architecture gates
        run: python scripts/check_architecture.py

      - name: Check refactor inventory
        run: python scripts/export_refactor_inventory.py --check

      - name: Check patch whitespace
        run: git diff --check

  build-and-release:
    needs: quality
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select release tag
        id: tag
        env:
          REQUESTED_TAG: ${{ inputs.tag_name }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          if [ -n "$REQUESTED_TAG" ]; then
            tag_name="$REQUESTED_TAG"
          else
            tag_name="$GITHUB_REF_NAME"
          fi
          echo "tag_name=$tag_name" >> "$GITHUB_OUTPUT"

      - name: Build source archive
        run: git archive --format=tar.gz --output=project.tar.gz HEAD

      - name: Prepare release notes
        run: git log -1 --pretty=%B > release-notes.md

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ steps.tag.outputs.tag_name }}
        run: |
          gh release create "$TAG_NAME" project.tar.gz \
            --target "$GITHUB_SHA" \
            --title "Release $TAG_NAME" \
            --notes-file release-notes.md
